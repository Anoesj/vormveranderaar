[package]
name = "solver"
version = "0.1.0"
edition = "2021"
description = "Shapeshifter puzzle solver compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
indexmap = { version = "2", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
# wasm-opt downloads a binary at build time; keep things simple and rely on
# rustc's optimizations.
wasm-opt = false
